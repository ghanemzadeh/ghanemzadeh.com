name: Update newsletter from Substack

on:
  schedule:
    # 12:00 UTC daily (5am PT / 8am ET).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Regenerate article rows
        id: newsletter
        # A Substack outage must not hold back the Sprint, sitemap and llms
        # steps below. The last step still fails the run so it shows.
        continue-on-error: true
        run: node scripts/update-newsletter.mjs
        env:
          # Cloudflare Worker proxy used when Substack blocks the runner's
          # datacenter IP. See workers/substack-proxy/README.md.
          NEWSLETTER_PROXY_URL: ${{ vars.NEWSLETTER_PROXY_URL }}

      - name: Render Sprint dates and prices from config
        # Drops kickoffs whose Scoping Call window has closed (Sprint, offer, call pages).
        run: node scripts/render-sprint.mjs

      - name: Regenerate sitemap
        run: node scripts/update-sitemap.mjs

      - name: Regenerate llms-full.txt
        run: node scripts/generate-llms-full.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- '*.html' sitemap.xml llms-full.txt; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml llms-full.txt
          git commit -m "chore: refresh newsletter + sitemap [skip ci]"
          git push

      - name: Fail if the newsletter step failed
        if: steps.newsletter.outcome == 'failure'
        run: |
          echo "::error::Newsletter sync failed. See the 'Regenerate article rows' step log."
          exit 1
