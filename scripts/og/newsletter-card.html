<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newsletter OG card (1200x630)</title>
<!--
  Source template for assets/og-newsletter.jpg, the link-preview image used by
  /newsletter/ on X, LinkedIn, Slack and messaging apps. Render with:
    python3 scripts/og/render.py scripts/og/newsletter-card.html assets/og-newsletter.jpg
  Self-contained on purpose: no /main.css link, so a CSS edit here never needs a
  cache-bust bump. Colors mirror the :root tokens in main.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=block" rel="stylesheet">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #181818; }
  body { font-family: "Alegreya Sans", system-ui, sans-serif; color: #d4d4d4; -webkit-font-smoothing: antialiased; }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 64px 88px; display: flex; flex-direction: column; }
  .rule { width: 80px; height: 4px; background: #c89a3e; }
  .site { margin-top: 22px; font-size: 18px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #888; }
  .body { flex: 1; display: flex; align-items: center; gap: 56px; }
  .photo { flex: none; width: 208px; height: 208px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(200,154,62,.4); box-shadow: 0 0 0 12px rgba(200,154,62,.16); }
  .text { max-width: 800px; }
  .eyebrow { font-size: 20px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #c89a3e; }
  .title { margin: 10px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -.01em; color: #f5f5f5; }
  .hook { margin: 18px 0 0; font-size: 26px; line-height: 1.35; color: #b0b0b0; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 20px; }
  .pill { display: inline-block; padding: 14px 36px; border-radius: 999px; background: #c89a3e; color: #181818; font-size: 24px; font-weight: 700; line-height: 1; }
  .cadence { font-size: 20px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <div class="rule"></div>
  <div class="site">ghanemzadeh.com</div>
  <div class="body">
    <img class="photo" src="../../assets/profile.jpg" alt="">
    <div class="text">
      <div class="eyebrow">Two books · Four chapters · Free</div>
      <h1 class="title">Notes from the edge of building</h1>
      <p class="hook">By Nasser Ghanemzadeh. Your first email brings the opening chapters of both my books, free.</p>
      <div class="row"><span class="pill">Subscribe</span><span class="cadence">One short note a week.</span></div>
    </div>
  </div>
</div>
</body>
</html>
