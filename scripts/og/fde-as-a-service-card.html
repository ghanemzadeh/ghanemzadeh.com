<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FDE as a service OG card (1200x630)</title>
<!--
  Source template for assets/fde-as-a-service/og-fde-as-a-service.jpg, the link-preview image for /fde-as-a-service/. Render with:
    python3 scripts/og/render.py scripts/og/fde-as-a-service-card.html assets/fde-as-a-service/og-fde-as-a-service.jpg
  Dateless on purpose: X, LinkedIn and Slack cache the image for days.
  After a re-render, bump a ?v= on the og:image / twitter:image URLs (Cloudflare
  edge-caches the JPEG). Self-contained: colors mirror the :root tokens in main.css.
  Bottom 88px stay clear: X draws its title pill over that strip.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=block" rel="stylesheet">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #181818; }
  body { font-family: "Alegreya Sans", system-ui, sans-serif; color: #d4d4d4; -webkit-font-smoothing: antialiased; }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 64px 88px; display: flex; flex-direction: column; }
  .glow { position: absolute; right: -120px; top: -160px; width: 640px; height: 460px; background: radial-gradient(closest-side, rgba(200,154,62,.16), transparent 75%); }
  .rule { width: 80px; height: 4px; background: #c89a3e; }
  .site { margin-top: 22px; font-size: 18px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #888; }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .eyebrow { font-size: 20px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #c89a3e; }
  .title { margin: 12px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 74px; line-height: 1.04; letter-spacing: -.01em; color: #f5f5f5; max-width: 1000px; }
  .title em { font-style: italic; color: #c89a3e; white-space: nowrap; }
  .hook { margin: 20px 0 0; font-size: 28px; line-height: 1.35; color: #d4d4d4; max-width: 960px; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 12px 30px; border-radius: 999px; background: #c89a3e; color: #181818; font-size: 22px; font-weight: 700; line-height: 1; }
  .chip { display: inline-block; padding: 9px 20px; border-radius: 999px; border: 2px solid currentColor; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1; }
  .note { font-size: 21px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="rule"></div>
  <div class="site">ghanemzadeh.com</div>
  <div class="body">
    <div class="eyebrow">FDE as a service &middot; October 2026</div>
    <h1 class="title">Who sells forward deployed engineers, and <em>what it costs.</em></h1>
    <p class="hook">33 vendors, consultancies, marketplaces, and independents, checked on their own pages. Every published price.</p>
    <div class="row"><span class="chip" style="color:#c89a3e">33 providers</span><span class="chip" style="color:#c89a3e">8 publish prices</span><span class="note">&nbsp;Free CSV download.</span></div>
  </div>
</div>
</body>
</html>
