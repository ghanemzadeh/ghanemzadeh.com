<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FDE book OG card (1200x630)</title>
<!--
  Source template for assets/book/fde/og-cover.jpg, the link-preview image for
  /books/forward-deployed-ai-engineering/. Render with:
    python3 scripts/og/render.py scripts/og/fde-book-card.html assets/book/fde/og-cover.jpg
  Dateless on purpose (no page count or version): X, LinkedIn and Slack cache the image
  for days. After a re-render, bump the ?v= on the og:image / twitter:image URLs
  (Cloudflare edge-caches the JPEG). Colors mirror the :root tokens in main.css.
  Bottom 88px stay clear: X draws its title pill over that strip.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=block" rel="stylesheet">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #181818; }
  body { font-family: "Alegreya Sans", system-ui, sans-serif; color: #d4d4d4; -webkit-font-smoothing: antialiased; }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 64px 88px 470px; display: flex; flex-direction: column; }
  .glow { position: absolute; right: -120px; top: -160px; width: 640px; height: 460px; background: radial-gradient(closest-side, rgba(200,154,62,.16), transparent 75%); }
  .book { position: absolute; left: 34px; top: 14px; height: 556px; width: auto;
          -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 6%, #000 90%, transparent 100%);
          -webkit-mask-composite: source-in;
                  mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 6%, #000 90%, transparent 100%);
                  mask-composite: intersect; }
  .rule { width: 80px; height: 4px; background: #c89a3e; position: relative; }
  .site { margin-top: 22px; font-size: 18px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #888; position: relative; }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .eyebrow { font-size: 20px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #c89a3e; }
  .title { margin: 12px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 70px; line-height: 1.02; letter-spacing: -.01em; color: #f5f5f5; }
  .hook { margin: 18px 0 0; font-size: 26px; line-height: 1.35; color: #d4d4d4; max-width: 640px; }
  .row { margin-top: 28px; display: flex; align-items: center; gap: 14px; }
  .chip { display: inline-block; padding: 9px 20px; border-radius: 999px; border: 2px solid currentColor; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1; color: #c89a3e; }
  .note { font-size: 21px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <img class="book" src="../../assets/book/fde/cover-3d.png" alt="">
  <div class="rule"></div>
  <div class="site">ghanemzadeh.com</div>
  <div class="body">
    <div class="eyebrow">A book by Nasser Ghanemzadeh</div>
    <h1 class="title">Forward Deployed AI Engineering</h1>
    <p class="hook">The Forward Deployed Engineer (FDE) Guide to Shipping Enterprise AI from Pilot to Production</p>
    <div class="row"><span class="chip">Paperback</span><span class="chip">Kindle</span><span class="note">&nbsp;On Amazon.</span></div>
  </div>
</div>
</body>
</html>
